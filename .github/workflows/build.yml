name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-dsp:
    name: Tests del DSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y ejecutar
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/dsp_test.cpp -o dsp_test
          ./dsp_test

  build:
    name: ${{ matrix.name }}
    needs: test-dsp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            id: windows-x64
            cmake_args: ""
          - name: macOS arm64 (Apple Silicon)
            os: macos-latest        # runner Apple Silicon; el binario arm64 vale igual para M4
            id: macos-arm64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64

    steps:
      - uses: actions/checkout@v4

      # Compilador en PATH (MSVC x64) para poder usar Ninja en Windows
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      # Caché del compilador: la 1.ª ejecución compila JUCE entero; las siguientes casi no compilan nada
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.id }}
          max-size: 500M

      - name: Instalar Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # ---- AAX (Pro Tools), opcional ----------------------------------------------------------
      # Se activa solo si defines la variable de repositorio AAX_SDK_REPO (p. ej. "voodatari/aax-sdk",
      # un repo PRIVADO con el SDK de Avid) y el secreto AAX_SDK_TOKEN (PAT con acceso de lectura).
      - name: Descargar SDK de AAX
        id: aax
        if: vars.AAX_SDK_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AAX_SDK_REPO }}
          token: ${{ secrets.AAX_SDK_TOKEN }}
          path: aax-sdk

      - name: Configurar
        shell: bash
        run: |
          AAX_ARG=""
          if [ -d aax-sdk ]; then AAX_ARG="-DAAX_SDK_PATH=$GITHUB_WORKSPACE/aax-sdk"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_args }} $AAX_ARG

      - name: Compilar
        run: cmake --build build --parallel

      - name: Estadísticas de ccache
        run: ccache --show-stats

      # ---- macOS: firma ad-hoc (sin cuenta de desarrollador) y empaquetado -------------------
      - name: Firmar (ad-hoc) y empaquetar - macOS
        if: runner.os == 'macOS'
        run: |
          set -e
          OUT=build/StereoExpander_artefacts/Release
          mkdir -p dist
          for b in "$OUT/VST3/Stereo Expander.vst3" "$OUT/AU/Stereo Expander.component" "$OUT/Standalone/Stereo Expander.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b"
          done
          lipo -archs "$OUT/VST3/Stereo Expander.vst3/Contents/MacOS/Stereo Expander"
          ditto -c -k --keepParent "$OUT/VST3/Stereo Expander.vst3"            "dist/StereoExpander-VST3-${{ matrix.id }}.zip"
          ditto -c -k --keepParent "$OUT/AU/Stereo Expander.component"         "dist/StereoExpander-AU-${{ matrix.id }}.zip"
          ditto -c -k --keepParent "$OUT/Standalone/Stereo Expander.app"       "dist/StereoExpander-Standalone-${{ matrix.id }}.zip"
          # AAX: SIN firmar con PACE (solo carga en Pro Tools Developer). Ver README.
          if [ -d "$OUT/AAX/Stereo Expander.aaxplugin" ]; then
            ditto -c -k --keepParent "$OUT/AAX/Stereo Expander.aaxplugin"      "dist/StereoExpander-AAX-UNSIGNED-${{ matrix.id }}.zip"
          fi

      # ---- Windows ---------------------------------------------------------------------------
      - name: Empaquetar - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/StereoExpander_artefacts/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/VST3/Stereo Expander.vst3"            -DestinationPath "dist/StereoExpander-VST3-${{ matrix.id }}.zip"
          Compress-Archive -Path "$out/Standalone/Stereo Expander.exe"       -DestinationPath "dist/StereoExpander-Standalone-${{ matrix.id }}.zip"
          if (Test-Path "$out/AAX/Stereo Expander.aaxplugin") {
            Compress-Archive -Path "$out/AAX/Stereo Expander.aaxplugin"      -DestinationPath "dist/StereoExpander-AAX-UNSIGNED-${{ matrix.id }}.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: StereoExpander-${{ matrix.id }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
